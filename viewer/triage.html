<!doctype html>
<!--
  PURPOSE: The triage page: which telemetry nodes need attention, why, and what has been done about it. It shows PIPELINE HEALTH (delivery, latency, flat or saturated channels), never a clinical statement.
  INPUT: the triage API on the same origin (backend/triage/app.py): /ui-config.json, /api/*, /fhir/*. The person signs in through Keycloak (OIDC code flow with PKCE) or, in dev mode on loopback, picks a fixed dev user.
    e.g. GET /api/worklist -> {"nodes": [{"node": "EHG-1", "score": 55, "band": "warning", "sparkline": [99.1, 98.7], ...}]}
  OUTPUT: a worklist (most urgent first), a detail pane with Trend / Alerts / EHR tabs, and a dialog for the alert actions (acknowledge, escalate, resolve, note). Nothing is stored in the browser except the one-off PKCE values during sign-in.
  HOW: Plain HTML, CSS and JavaScript in three files (viewer/triage.css, viewer/triage.js): no framework, no CDN, no inline script or style, so the strict Content-Security-Policy of deploy/caddy/Caddyfile applies. The access token lives in a JavaScript
    variable only (a reload signs in again). Text from the server is always inserted as text, never as HTML.
  ROLE IN THESIS: The operator interface (production-topology.md, hop 6a). A research prototype, not for clinical decision-making.
  BEFORE -> AFTER: Before: Grafana and the raw viewer. After: a role-aware worklist with an alert workflow.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EHG triage</title>
<link rel="stylesheet" href="/triage.css">
</head>
<body>
<div id="dev-banner" class="banner" role="alert" hidden></div>
<header>
  <h1>EHG telemetry triage</h1>
  <p id="who" aria-live="polite"></p>
  <button id="signout" type="button" hidden>Sign out</button>
</header>
<p id="notice" role="status" aria-live="polite"></p>

<section id="login" hidden>
  <p id="login-text">Sign in to see the worklist.</p>
  <label id="dev-pick" hidden>Dev user <select id="dev-user"></select></label>
  <button id="login-btn" type="button">Sign in</button>
</section>

<main id="app" hidden>
  <section aria-labelledby="wl-h">
    <h2 id="wl-h">Worklist</h2>
    <p id="wl-meta"></p>
    <table id="worklist">
      <thead><tr><th scope="col">Status</th><th scope="col">Node</th><th scope="col">Score</th><th scope="col">Open alerts</th><th scope="col">Rules</th><th scope="col">Delivery, last 7 days</th><th scope="col">Waiting</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section id="detail" aria-labelledby="d-h" hidden>
    <h2 id="d-h"></h2>
    <p id="d-meta"></p>
    <div role="tablist" aria-label="Node information">
      <button role="tab" id="tab-trend" aria-selected="true" aria-controls="panel" data-tab="trend" type="button">Trend</button>
      <button role="tab" id="tab-alerts" aria-selected="false" aria-controls="panel" data-tab="alerts" type="button">Alerts</button>
      <button role="tab" id="tab-ehr" aria-selected="false" aria-controls="panel" data-tab="ehr" type="button">EHR</button>
    </div>
    <div id="panel" role="tabpanel"></div>
  </section>
</main>

<dialog id="action-dialog" aria-labelledby="dlg-h">
  <form method="dialog" id="action-form" novalidate>
    <h3 id="dlg-h"></h3>
    <label>Note <textarea id="dlg-note" rows="4" maxlength="2000"></textarea></label>
    <p id="dlg-error" role="alert"></p>
    <div class="row"><button id="dlg-cancel" type="button">Cancel</button><button id="dlg-ok" type="submit">Confirm</button></div>
  </form>
</dialog>

<footer><p id="purpose"></p></footer>
<script src="/triage.js"></script>
</body>
</html>
