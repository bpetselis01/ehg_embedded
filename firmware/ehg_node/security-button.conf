# PURPOSE: Overlay for the "button pairing" build (firmware/build.sh --pairing-button): an ENCRYPTED link, and new pairings only for 60 s after Button 2.
#   For boards nobody can read a UART log from. Alternative to security.conf (do not use both): no passkey, so Just Works.
# HOW: Merged over prj.conf by -Dehg_node_EXTRA_CONF_FILE. Protects against passive listening and against anyone who is not at the board;
#   it does NOT stop an active man-in-the-middle inside the window. See docs/security.md and docs/decisions.
CONFIG_EHG_REQUIRE_PAIRING=y
CONFIG_EHG_PAIRING_BUTTON=y
CONFIG_BT_SMP=y
# LESC only (no legacy pairing, which can be sniffed): BT_SMP_SC_PAIR_ONLY. NOT BT_SMP_SC_ONLY: that is "Secure Connections Only Mode", security level 4 =
# authenticated pairing, which rejects Just Works (first phone test: pairing failed, reason 4; bt_conn_set_security returned -EINVAL).
CONFIG_BT_SMP_SC_PAIR_ONLY=y
# No passkey exists, so MITM is not requested; the Kconfig default is y, so say n.
CONFIG_BT_SMP_ENFORCE_MITM=n
# main.c decides, per pairing request, whether the Button 2 window is open
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_BONDABLE=y
# the default is 1: a Mac bond left in flash would then block the phone. Room for the phone, the Mac and a spare.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# the MCUmgr (OTA) service needs the encrypted link too (default would be open read/write)
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
