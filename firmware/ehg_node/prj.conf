# PURPOSE: Turns on, and sizes, the Zephyr + Bluetooth features the firmware uses.
# HOW: 1 setting per line (CONFIG_X=value), fixed at build time.
# ROLE IN THESIS: Sets radio packet size + buffering: limits speed and latency (H1), and makes a
#   slow link wait instead of losing data (H2).
# BEFORE -> AFTER: Read by firmware/build.sh. Affects main.c and ehg_service.c.
# SEE: docs/firmware.md, docs/research/nrf-ble-environment.md (sources for each value).

# ---- serial log over USB (VCOM0, 115200 baud); HWINFO = read the chip ID for the name
CONFIG_LOG=y
CONFIG_HWINFO=y

# ---- Bluetooth: the board is the "peripheral" (waits to be connected), 1 connection at a time
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME="EHG-0000"

# Biggest message sizes: up to 244 bytes of packet per Bluetooth message.
# (MTU 247 = message size; 251 = radio packet size. ehg_service.c won't build if a packet is bigger.)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Send buffers: when all 10 are busy, sending waits (data backs up, isn't lost)
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# radio-side send buffers, same count as above (else a warning at start-up)
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=10
# must be more than the send-buffer count (build check)
CONFIG_BT_BUF_EVT_RX_COUNT=11

# How often board and laptop talk: every 15-30 ms (units of 1.25 ms: 12 = 15 ms, 24 = 30 ms).
# Link counts as lost after 6 s of silence (600 x 10 ms). Values follow Apple's accessory rules (macOS laptop).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

CONFIG_MAIN_STACK_SIZE=2048
