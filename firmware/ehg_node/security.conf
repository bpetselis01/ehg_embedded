# PURPOSE: Overlay for the "secure" build (firmware/build.sh --secure): the link needs LE Secure Connections passkey pairing.
# HOW: Merged over prj.conf by -Dehg_node_EXTRA_CONF_FILE. The default build does not read this file and is unchanged.
# SEE: docs/security.md (BLE pairing), docs/troubleshooting.md (stale bonds).
CONFIG_EHG_REQUIRE_PAIRING=y
CONFIG_BT_SMP=y
# LESC only (no legacy pairing, which can be sniffed); this makes security level 4 the only way in
CONFIG_BT_SMP_SC_ONLY=y
# a passkey is mandatory (no Just Works)
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_BONDABLE=y
# bonds survive a reset: stored in the flash "storage" partition (0xf8000, 32 KB, outside both app slots)
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# without a storage backend CONFIG_SETTINGS silently becomes SETTINGS_NONE and no bond is ever saved (seen on the first secure build)
CONFIG_NVS=y
# the MCUmgr (OTA) service too: Nordic's OTA helper (nrf/samples/common/mcumgr_bt_ota_dfu) defaults it to open read/write, which would leave
# firmware upload unauthenticated in the one build that is meant to be secure
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
