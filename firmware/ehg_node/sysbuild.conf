# Sysbuild settings: what gets built next to our app.
# MCUboot = a small bootloader at the start of flash. It keeps 2 slots for the app, so a new firmware
# can be uploaded over Bluetooth (MCUmgr/SMP, prj.conf) into the spare slot, tested, then confirmed;
# a bad update falls back to the old one. Uses MCUboot's public development key: fine for a thesis
# rig, not for a real device (that needs its own signing key, SB_CONFIG_BOOT_SIGNATURE_KEY_FILE).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
