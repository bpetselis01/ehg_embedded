# PURPOSE: NATS server with JetStream, the internal message bus (docs/decisions/0012-timescaledb-nats-data-platform.md).
# INPUT: none. OUTPUT: client port 4222 and monitoring port 8222, both on the Docker network only (nothing is published to the host).
# HOW: JetStream keeps streams on disk in /data (the data volume). The memory store is capped at 256 MB and the file store at 20 GB so the 200 GB disk and 12 GB RAM are safe
#   (NATS would otherwise default to 75% of system RAM). The container also sets GOMEMLIMIT=384MiB.
#   No authentication yet: only containers on the private Docker network can reach it. Credentials arrive with the bridge and writers (Unit 6).
# ROLE IN THESIS: Durable, replayable bus between the MQTT broker and the stores and services.
# BEFORE -> AFTER: Before: no bus. After: an empty JetStream; streams are created by the bridge (Unit 6).
server_name: ehg-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 20GB
}
