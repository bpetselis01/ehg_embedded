# Configuration of the reference EHR, HAPI FHIR JPA server (image hapiproject/hapi:v7.6.0), as a FHIR R5 server on the private Docker network.
server:
  port: 8080
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: 'health'
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
spring:
  main:
    allow-circular-references: true
  flyway:
    enabled: false
    baselineOnMigrate: true
    fail-on-missing-locations: false
  datasource:
    url: jdbc:postgresql://postgres:5432/hapi
    username: hapi
    password: ${HAPI_DB_PASSWORD}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
  jpa:
    properties:
      hibernate.format_sql: false
      hibernate.show_sql: false
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: false
hapi:
  fhir:
    fhir_version: R5
    openapi_enabled: false
    narrative_enabled: false
    mdm_enabled: false
    cr:
      enabled: false
    cdshooks:
      enabled: false
    allow_external_references: false
    allow_multiple_delete: false
    delete_expunge_enabled: false
    expunge_enabled: false
    enforce_referential_integrity_on_write: true
    default_page_size: 20
    max_page_size: 50
