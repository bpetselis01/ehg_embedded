# EHG cloud core: the services that can run today, on the Oracle Always Free VM (2 OCPU / 12 GB arm64).
# Run (on the VM, by deploy/update.sh): docker compose --env-file /run/ehg/runtime.env --env-file /opt/ehg/etc/site.env -f deploy/compose/docker-compose.cloud.yml up -d
#
# PURPOSE: The cloud stack as one file: edge (Caddy), MQTT broker with mTLS, NATS JetStream bus, PostgreSQL + TimescaleDB, and the observability stack.
#   It is still PARTIAL: step-ca, the enrolment API and the FHIR sync worker are NOT in it (the enrolment API has no service entry point yet; step-ca is initialised by hand; the sync worker needs the converted
#   recordings' gain and baseline, which are not on the VM). Their memory is reserved in tests/test_deploy_assets.py so the finished stack is known to fit.
# INPUT: /run/ehg/runtime.env (decrypted secrets: POSTGRES_PASSWORD, EHG_DB_PASSWORD, HAPI_DB_PASSWORD, KEYCLOAK_DB_PASSWORD, EXPORTER_DB_PASSWORD, TRIAGE_DB_PASSWORD,
#   KEYCLOAK_ADMIN_PASSWORD, TRIAGE_API_CLIENT_SECRET, ENROLL_API_CLIENT_SECRET, FHIR_SYNC_CLIENT_SECRET, GRAFANA_ADMIN_PASSWORD; generate with openssl rand -hex 24, because passwords go into URLs and connection strings), /opt/ehg/etc/site.env (EHG_DOMAIN), certificates in EHG_PKI_DIR (default /opt/ehg/pki: ca-chain.crt, broker.crt, broker.key, ca.crl).
#   A missing secret stops `up` with a message naming it (the "?" in the variable).
# OUTPUT: the host publishes ONLY 80, 443 (Caddy) and 8883 (Mosquitto). Postgres, NATS, Grafana, Prometheus, Loki are on the private Docker network only.
#   Grafana has no route until Unit 11 puts it behind Caddy and Keycloak. To look at it before then, tunnel to the container's own address
#   (docker inspect gives it): ssh -L 3000:<container-ip>:3000 ubuntu@<vm>; see deploy/README.md.
# HOW: HOST MOUNTS ARE MINIMAL ON PURPOSE (a security review found the first draft too generous): no container mounts the host root, /run, /var/run or Docker's
#   data directory, because any of them reaches the Docker socket or every container's environment (which holds the database passwords). Alloy reads only the
#   systemd journal (Docker's log driver is journald) and forwards only entries with a container name, node-exporter gets /proc, /sys and a metrics file written by cron, cAdvisor gets /sys. cAdvisor therefore
#   shows containers by cgroup id, not by name. Two networks: "edge" (Caddy, Mosquitto: the only ones with a route to the internet) and "internal" (no route out at all).
#   Cloud-init also blocks containers from the cloud metadata address 169.254.169.254.
#   Every image is pinned by version AND digest (all checked to have linux/arm64 on 2026-11-03). Every service has no-new-privileges and a memory limit;
#   some also drop all capabilities and use a read-only root filesystem (hardening that nobody has been able to test yet: if a service will not start, look there first).
#   Named volumes live in Docker's data-root on the 150 GB data volume (/srv/ehg-data/docker). Containers that need to reach the internet later (Alertmanager's
#   webhook, Unit 12) must be added to "edge" deliberately.
#   A service that cannot run a health check (its image has no shell or wget) says so in the label ehg.healthcheck instead of silently having none.
# STATUS: NEVER STARTED. Docker was not running when this was written; `docker compose config` is the only check done. Expect first-boot fixes.
# ROLE IN THESIS: The cloud core of docs/production-topology.md, sized by docs/decisions/0010 and the budget in tests/test_deploy_assets.py.
# BEFORE -> AFTER: Before: backend/docker-compose.yml on a laptop. After: this file on the VM, next to (not replacing) the local stack.
name: ehg

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

# The Python services share one image, BUILT on the VM from this repository (backend/platform.Dockerfile; its base image is pinned by digest). update.sh builds it before `up`.
x-python: &python
  <<: *service
  networks: [internal]
  build:
    context: ../..
    dockerfile: backend/platform.Dockerfile
  image: ehg-platform:cloud
  pull_policy: build
  read_only: true
  cap_drop: [ALL]

services:
  caddy:
    <<: *service
    networks: [edge, internal]
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    ports:
      - "80:80"
      - "443:443"
    environment:
      EHG_DOMAIN: ${EHG_DOMAIN:?EHG_DOMAIN is not set (site.env)}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mosquitto:
    <<: *service
    networks: [edge, internal]
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    ports:
      - "8883:8883"
    volumes:
      - ../../backend/mosquitto/mosquitto.tls.conf:/mosquitto/config/mosquitto.conf:ro
      # the hand-written ACL (a gateway may write any node id) unless EHG_ACL_FILE points at one made by tools/gen_acl.py (each gateway pinned to its nodes)
      - ${EHG_ACL_FILE:-../../backend/mosquitto/acl}:/mosquitto/config/acl:ro
      # single certificate files, never the PKI directory (it can hold CA private keys)
      - ${EHG_PKI_DIR:-/opt/ehg/pki}/ca-chain.crt:/mosquitto/pki/ca-chain.crt:ro
      - ${EHG_PKI_DIR:-/opt/ehg/pki}/broker.crt:/mosquitto/pki/broker.crt:ro
      - ${EHG_PKI_DIR:-/opt/ehg/pki}/broker.key:/mosquitto/pki/broker.key:ro
      - ${EHG_PKI_DIR:-/opt/ehg/pki}/ca.crl:/mosquitto/pki/ca.crl:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883 || nc -w 1 127.0.0.1 8883 </dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nats:
    <<: *service
    networks: [internal]
    image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      GOMEMLIMIT: 384MiB
    volumes:
      - ../nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    cap_drop: [ALL]
    read_only: true
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    <<: *service
    networks: [internal]
    image: timescale/timescaledb-ha:pg16.15-ts2.31.0@sha256:98f88217cb7be56655f842d9920f90d0b4893b67b3463f93084548b433ed5c93
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB", "-c", "max_connections=100"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set (decrypt the secrets first)}
      EHG_DB_PASSWORD: ${EHG_DB_PASSWORD:?EHG_DB_PASSWORD is not set}
      HAPI_DB_PASSWORD: ${HAPI_DB_PASSWORD:?HAPI_DB_PASSWORD is not set}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is not set}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?EXPORTER_DB_PASSWORD is not set}
      TRIAGE_DB_PASSWORD: ${TRIAGE_DB_PASSWORD:?TRIAGE_DB_PASSWORD is not set}
    volumes:
      - ../postgres/10-init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - pg-data:/home/postgres/pgdata
    mem_limit: 2048m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  prometheus:
    <<: *service
    networks: [internal]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    cap_drop: [ALL]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    <<: *service
    networks: [internal]
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    cap_drop: [ALL]
    read_only: true
    mem_limit: 48m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    <<: *service
    networks: [internal]
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    cap_drop: [ALL]
    mem_limit: 320m
    labels:
      ehg.healthcheck: "none: the Loki image has no shell or wget to run one in; Prometheus scrapes loki:3100 instead"

  grafana:
    <<: *service
    networks: [internal]
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${EHG_DOMAIN:?EHG_DOMAIN is not set (site.env)}/grafana/  # the front door serves Grafana under /grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_METRICS_ENABLED: "false"  # defence in depth: Grafana's own /metrics is off, whatever the front door does
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  alloy:
    <<: *service
    networks: [internal]
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ../observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    cap_drop: [ALL]
    read_only: true
    mem_limit: 96m
    labels:
      ehg.healthcheck: "none: the Alloy image has no shell or wget; Prometheus scrapes alloy:12345 instead"

  node-exporter:
    <<: *service
    networks: [internal]
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--no-collector.filesystem", "--collector.textfile.directory=/textfile"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/ehg-metrics:/textfile:ro
    cap_drop: [ALL]
    read_only: true
    mem_limit: 32m
    labels:
      ehg.healthcheck: "none: the node-exporter image is a single static binary with no shell; Prometheus scrapes node-exporter:9100 instead"

  cadvisor:
    <<: *service
    networks: [internal]
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    volumes:
      - /sys:/sys:ro
    cap_drop: [ALL]
    read_only: true
    mem_limit: 96m
    labels:
      ehg.healthcheck: "none: the cAdvisor image has no shell or wget; Prometheus scrapes cadvisor:8080 instead"

  postgres-exporter:
    <<: *service
    networks: [internal]
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ehg_exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD:?EXPORTER_DB_PASSWORD is not set}
    cap_drop: [ALL]
    read_only: true
    mem_limit: 32m
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      ehg.healthcheck: "none: the exporter image is a single static binary with no shell; Prometheus scrapes postgres-exporter:9187 instead"

  migrate:
    <<: *python
    restart: "no"
    command: ["python", "-m", "backend.db.migrate", "upgrade", "head"]
    environment:
      EHG_DB_URL: postgresql+psycopg://ehg:${EHG_DB_PASSWORD:?EHG_DB_PASSWORD is not set}@postgres:5432/ehg
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    labels:
      ehg.oneshot: "true"
      ehg.healthcheck: "none: a one-shot job; it must exit 0 once the schema is current (update.sh accepts an exited service with exit code 0)"

  bridge:
    <<: *python
    command: ["python", "-m", "backend.bridge.bridge"]
    environment:
      NATS_URL: nats://nats:4222
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_TLS: "1"
      MQTT_CA: /pki/ca-chain.crt
      MQTT_CERT: /pki/ehg-bridge.crt
      MQTT_KEY: /pki/ehg-bridge.key
      BRIDGE_METRICS_PORT: "9201"
    volumes:
      # single certificate files of this component only, never the PKI directory
      - ${EHG_PKI_DIR:-/opt/ehg/pki}/ca-chain.crt:/pki/ca-chain.crt:ro
      - ${EHG_PKI_DIR:-/opt/ehg/pki}/ehg-bridge.crt:/pki/ehg-bridge.crt:ro
      - ${EHG_PKI_DIR:-/opt/ehg/pki}/ehg-bridge.key:/pki/ehg-bridge.key:ro
    depends_on:
      nats:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9201/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ts-writer:
    <<: *python
    command: ["python", "-m", "backend.ts_writer.writer"]
    environment:
      NATS_URL: nats://nats:4222
      EHG_DB_DSN: host=postgres port=5432 dbname=ehg user=ehg password=${EHG_DB_PASSWORD:?EHG_DB_PASSWORD is not set}
      WRITER_METRICS_PORT: "9202"
    depends_on:
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9202/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  triage:
    <<: *python
    command: ["python", "-m", "backend.triage.stream"]
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER: https://${EHG_DOMAIN:?EHG_DOMAIN is not set (site.env)}/auth/realms/ehg
      OIDC_UI_AUTHORITY: https://${EHG_DOMAIN}/auth/realms/ehg
      OIDC_AUDIENCE: triage-api
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/ehg/protocol/openid-connect/certs
      EHG_TRIAGE_DSN: host=postgres port=5432 dbname=ehg user=ehg_triage password=${TRIAGE_DB_PASSWORD:?TRIAGE_DB_PASSWORD is not set}
      NATS_URL: nats://nats:4222
      FHIR_BASE_URL: http://hapi:8080/fhir
      BIND_HOST: 0.0.0.0
      TRIAGE_PORT: "8780"
    depends_on:
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  keycloak:
    <<: *service
    networks: [internal]
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is not set}
      KC_HOSTNAME: https://${EHG_DOMAIN:?EHG_DOMAIN is not set (site.env)}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65
      # filled into realm-ehg.json at import (the file holds placeholders only)
      EHG_DOMAIN: ${EHG_DOMAIN}
      TRIAGE_API_CLIENT_SECRET: ${TRIAGE_API_CLIENT_SECRET:?TRIAGE_API_CLIENT_SECRET is not set}
      ENROLL_API_CLIENT_SECRET: ${ENROLL_API_CLIENT_SECRET:?ENROLL_API_CLIENT_SECRET is not set}
      FHIR_SYNC_CLIENT_SECRET: ${FHIR_SYNC_CLIENT_SECRET:?FHIR_SYNC_CLIENT_SECRET is not set}
    volumes:
      - ../keycloak/realm-ehg.json:/opt/keycloak/data/import/realm-ehg.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    mem_limit: 1360m
    labels:
      ehg.healthcheck: "none: the right probe (the management port, /health/ready) was not verified and a wrong one would roll back every release; sign-in itself is the check"

  hapi:
    <<: *service
    networks: [internal]
    image: hapiproject/hapi:v7.6.0@sha256:4771a178e764896c83881c1b3a52bd487e53d06e1acc3653ea0db0c6f6b2b8a1
    environment:
      SPRING_CONFIG_LOCATION: file:///app/config/application.yaml
      HAPI_DB_PASSWORD: ${HAPI_DB_PASSWORD:?HAPI_DB_PASSWORD is not set}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    volumes:
      - ../hapi/application.yaml:/app/config/application.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    mem_limit: 2300m
    labels:
      ehg.healthcheck: "none: believed to be a distroless image with no shell or wget (not verified); readiness is seen through the triage facade (/fhir/metadata answers 502 while HAPI is down)"

networks:
  edge: {}
  internal:
    internal: true # no route out of the host and none in: only containers on this network can talk to each other

volumes:
  caddy-data:
  caddy-config:
  mosquitto-data:
  nats-data:
  pg-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
  alloy-data:
