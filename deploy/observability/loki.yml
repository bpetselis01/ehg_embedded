# PURPOSE: Loki log store for the container logs that Alloy ships: single process, files on the data volume, 7 days kept.
# INPUT: log lines pushed to http://loki:3100 by Alloy. OUTPUT: queryable logs for Grafana.
# HOW: Standard single-binary layout: filesystem storage under /loki, TSDB index (schema v13), the compactor deletes data older than 168 h.
# STATUS: UNVERIFIED against the pinned Loki version (nobody has started it yet).
# ROLE IN THESIS: Searchable logs (docs/decisions/0016).
# BEFORE -> AFTER: Before: logs only in `docker logs`. After: 7 days of logs in Grafana.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
