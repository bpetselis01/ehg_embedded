# The alert routing to use ONCE a notification channel exists.
route:
  receiver: ehg-webhook
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - matchers: [severity="page"]
      receiver: ehg-webhook
      repeat_interval: 4h

receivers:
  - name: ehg-webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/alert_webhook_url
        send_resolved: true
