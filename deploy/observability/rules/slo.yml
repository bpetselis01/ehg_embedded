# PURPOSE: Recording rules for the cloud core. Only the backup age is left: the delivery, latency, backlog and availability rules read metrics of the triage service and the writer, which were removed on 2026-11-11 (docs/slo.md).
# INPUT: ehg_backup_last_success_timestamp_seconds from deploy/backup/backup.sh (through node-exporter's textfile collector).
# OUTPUT: the series ehg:backup_age_seconds:max.
# STATUS: evaluated by promtool unit tests (deploy/observability/tests/rules_test.yml) when Docker is up; tests/test_observability_rules.py checks the structure.
# ROLE IN THESIS: Backup freshness of the cloud core. Delivery and latency are measured on the home path by eval/ (H1, H2), not here.
# BEFORE -> AFTER: Before: no service-level numbers from the VM. After: one recording rule.
groups:
  - name: ehg_slo
    interval: 30s
    rules:
      - record: ehg:backup_age_seconds:max
        expr: time() - max(ehg_backup_last_success_timestamp_seconds)
