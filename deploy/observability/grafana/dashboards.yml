# Tells Grafana to load every dashboard JSON file in /var/lib/grafana-dashboards (mounted from deploy/observability/grafana/dashboards/).
apiVersion: 1

providers:
  - name: ehg
    folder: EHG
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana-dashboards
