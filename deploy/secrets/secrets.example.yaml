# PURPOSE: The list of secrets the cloud stack needs, with obviously fake values. Copy to secrets.yaml, fill in strong random values, encrypt, commit ONLY the encrypted result.
#   cp secrets.example.yaml secrets.yaml && $EDITOR secrets.yaml && sops --encrypt --age "$(grep -o 'age1[a-z0-9]*' ~/ehg-age.key)" secrets.yaml > secrets.sops.yaml && rm secrets.yaml
#   (the recipient is passed with --age because the file you encrypt is called secrets.yaml, which the creation rule in ../.sops.yaml does not match)
#   (secrets.yaml is gitignored; never commit it. Generate values with: openssl rand -hex 24 : HEX, not base64, because these go into URLs and connection strings, where / + = would break them)
# INPUT: nothing real. OUTPUT: deploy/update.sh decrypts secrets.sops.yaml to /run/ehg/runtime.env (memory only) and docker compose reads it.
# ROLE IN THESIS: Names every secret in one place so a missing one fails loudly (docs/security.md).
# BEFORE -> AFTER: Before: nothing. After: one encrypted file in git.
POSTGRES_PASSWORD: CHANGE-ME-superuser
EHG_DB_PASSWORD: CHANGE-ME-ehg
HAPI_DB_PASSWORD: CHANGE-ME-hapi
KEYCLOAK_DB_PASSWORD: CHANGE-ME-keycloak
EXPORTER_DB_PASSWORD: CHANGE-ME-exporter
TRIAGE_DB_PASSWORD: CHANGE-ME-triage
ENROLL_DB_PASSWORD: CHANGE-ME-enroll
FHIR_DB_PASSWORD: CHANGE-ME-fhir
GRAFANA_ADMIN_PASSWORD: CHANGE-ME-grafana
KEYCLOAK_ADMIN_PASSWORD: CHANGE-ME-keycloak-admin
TRIAGE_API_CLIENT_SECRET: CHANGE-ME-triage-api-client
ENROLL_API_CLIENT_SECRET: CHANGE-ME-enroll-api-client
FHIR_SYNC_CLIENT_SECRET: CHANGE-ME-fhir-sync-client
