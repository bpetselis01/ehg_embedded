# PURPOSE: The list of secrets the cloud stack needs, with obviously fake values. Copy to secrets.yaml, fill in strong random values, encrypt, commit ONLY the encrypted result.
#   cp secrets.example.yaml secrets.yaml && $EDITOR secrets.yaml && sops --encrypt secrets.yaml > secrets.sops.yaml && rm secrets.yaml
#   (secrets.yaml is gitignored; never commit it. Generate values with: openssl rand -base64 24)
# INPUT: nothing real. OUTPUT: deploy/update.sh decrypts secrets.sops.yaml to /run/ehg/runtime.env (memory only) and docker compose reads it.
# ROLE IN THESIS: Names every secret in one place so a missing one fails loudly (docs/security.md).
# BEFORE -> AFTER: Before: nothing. After: one encrypted file in git.
POSTGRES_PASSWORD: CHANGE-ME-superuser
EHG_DB_PASSWORD: CHANGE-ME-ehg
HAPI_DB_PASSWORD: CHANGE-ME-hapi
KEYCLOAK_DB_PASSWORD: CHANGE-ME-keycloak
EXPORTER_DB_PASSWORD: CHANGE-ME-exporter
GRAFANA_ADMIN_PASSWORD: CHANGE-ME-grafana
