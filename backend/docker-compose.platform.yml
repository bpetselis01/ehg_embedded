# EHG data platform on the laptop: NATS JetStream, PostgreSQL + TimescaleDB, the MQTT->NATS bridge, the TimescaleDB writer and an Influx writer fed from the same stream.
# Run: cd backend && docker compose --profile platform -f docker-compose.yml -f docker-compose.platform.yml up -d
#   (add -f docker-compose.cloud.yml for TLS between the gateway and the broker: the bridge then needs its own certificate, see below)
#
# PURPOSE: The local copy of Unit 6, behind a compose PROFILE so the default `docker compose up -d` still starts exactly the original 4 containers (decision 0007).
# INPUT: backend/.env plus EHG_DB_PASSWORD (any value for local use; the cloud stack takes it from the encrypted secrets). Certificates only if the cloud override is also used.
# OUTPUT: new containers nats, timescaledb, migrate (runs once), bridge, ts-writer, influx-writer. Ports bound to 127.0.0.1: NATS 4222 and 8222, PostgreSQL 5433 (not 5432: Supabase).
#   After the run: `eval/parity.py` compares InfluxDB and TimescaleDB. For a fair comparison STOP the original `ingest` first (docker compose stop ingest), otherwise both ingest paths write InfluxDB.
# HOW: One image (backend/platform.Dockerfile, repository root as build context) for bridge, ts-writer and migrate. The database is created by deploy/postgres/10-init-databases.sh, the same
#   script as in the cloud stack. The migrate job applies all revisions (head) unless EHG_MIGRATE_TARGET says otherwise, e.g. 0001 on a server without TimescaleDB.
# STATUS: NEVER STARTED. Docker was not running; `docker compose config` is the only check done.
# ROLE IN THESIS: The environment of the parity proof (Checkpoint 4).
# BEFORE -> AFTER: Before: MQTT -> ingest -> InfluxDB only. After (with the profile): MQTT -> bridge -> NATS -> {ts-writer -> TimescaleDB, influx-writer -> InfluxDB}.
x-platform: &platform
  build:
    context: ..
    dockerfile: backend/platform.Dockerfile
  image: ehg-platform
  restart: unless-stopped
  profiles: [platform]

services:
  nats:
    image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    profiles: [platform]
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      GOMEMLIMIT: 384MiB
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes:
      - ../deploy/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb-ha:pg16.15-ts2.31.0@sha256:98f88217cb7be56655f842d9920f90d0b4893b67b3463f93084548b433ed5c93
    profiles: [platform]
    environment:
      POSTGRES_PASSWORD: ${EHG_DB_PASSWORD:-local-only-change-me}
      EHG_DB_PASSWORD: ${EHG_DB_PASSWORD:-local-only-change-me}
      HAPI_DB_PASSWORD: ${EHG_DB_PASSWORD:-local-only-change-me}
      KEYCLOAK_DB_PASSWORD: ${EHG_DB_PASSWORD:-local-only-change-me}
      EXPORTER_DB_PASSWORD: ${EHG_DB_PASSWORD:-local-only-change-me}
      TRIAGE_DB_PASSWORD: ${EHG_DB_PASSWORD:-local-only-change-me}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ../deploy/postgres/10-init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - pg-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  migrate:
    <<: *platform
    restart: "no"
    command: ["python", "-m", "backend.db.migrate", "upgrade", "${EHG_MIGRATE_TARGET:-head}"]
    environment:
      EHG_DB_URL: postgresql+psycopg://ehg:${EHG_DB_PASSWORD:-local-only-change-me}@timescaledb:5432/ehg
    depends_on:
      timescaledb:
        condition: service_healthy

  bridge:
    <<: *platform
    command: ["python", "-m", "backend.bridge.bridge"]
    environment:
      NATS_URL: nats://nats:4222
      MQTT_HOST: mosquitto
    depends_on: [nats, mosquitto]

  ts-writer:
    <<: *platform
    command: ["python", "-m", "backend.ts_writer.writer"]
    environment:
      NATS_URL: nats://nats:4222
      EHG_DB_DSN: host=timescaledb port=5432 dbname=ehg user=ehg password=${EHG_DB_PASSWORD:-local-only-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  influx-writer:
    build: ./ingest
    profiles: [platform]
    environment:
      INGEST_SOURCE: jetstream
      NATS_URL: nats://nats:4222
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    depends_on: [nats, influxdb]
    restart: unless-stopped

volumes:
  nats-data:
  pg-data:
