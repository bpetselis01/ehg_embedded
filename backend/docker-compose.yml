# EHG backend: MQTT broker -> ingest -> InfluxDB -> Grafana.
# Run: cd backend && docker compose up -d   (Grafana http://localhost:3300, Influx http://localhost:8086)
#
# PURPOSE: Starts the whole server side with one command, as 4 containers (isolated mini-computers).
# INPUT: backend/.env (passwords, token, org, bucket). MQTT JSON from the gateway on port 1883.
# OUTPUT: Grafana http://localhost:3300, InfluxDB http://localhost:8086, broker localhost:1883.
# HOW: mosquitto = MQTT post office; influxdb = time-series DB; ingest = backend/ingest/ingest.py,
#   copies MQTT messages into the DB; grafana = dashboards. Ports bound to 127.0.0.1 (this computer
#   only). Volumes keep data across restarts.
# ROLE IN THESIS: The backend in report Fig. 10 (Gantt Phase 2).
# BEFORE -> AFTER: Before: gateway/gateway.py publishes to port 1883. After: Grafana (3300) and
#   eval/ scripts (8086) read the stored data; viewer/server.py also listens on 1883.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7   # pinned pre-3.x on purpose, see spec A3
    ports: ["127.0.0.1:8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes: [influx-data:/var/lib/influxdb2]
    restart: unless-stopped

  ingest:
    build: ./ingest
    environment:
      MQTT_HOST: mosquitto
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    depends_on: [mosquitto, influxdb]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [influxdb]
    restart: unless-stopped

volumes:
  mosquitto-data:
  influx-data:
  grafana-data:
