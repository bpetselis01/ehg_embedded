# EHG backend, cloud profile: the same 4 containers with MQTT over TLS 1.3 and client certificates.
# Run: tools/pki.sh init --host localhost && cd backend && docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#
# PURPOSE: An override file: it changes only the broker and ingest of docker-compose.yml, so the default stack (plain 1883) is unchanged
#   when this file is not named (docs/decisions/0007-enterprise-evolution-keep-influx-as-reference.md).
# INPUT: certificates in backend/pki (tools/pki.sh init). MQTT_BIND (default 127.0.0.1) = which host address 8883 listens on.
#   e.g. a cloud VM would set MQTT_BIND=0.0.0.0; this laptop keeps the default.
# OUTPUT: broker on 127.0.0.1:8883 (mTLS). Port 1883 is NOT published to the host. Same Grafana (3300) and InfluxDB (8086).
#   e.g. `docker compose -f docker-compose.yml -f docker-compose.cloud.yml ps` still shows 4 containers.
# HOW: "!override" replaces the base file's port list instead of adding to it (Compose 2.24+). The ingest container presents
#   the ehg-ingest certificate; gateway and viewer run on the host and use their own certificates (gateway --mqtt-tls, viewer MQTT_* variables).
# ROLE IN THESIS: Lets the secured transport be tested locally before any cloud VM exists (Unit 2 of the hardening plan).
# BEFORE -> AFTER: Before: gateway and ingest talk plain MQTT on 1883. After: both need a certificate signed by backend/pki.
services:
  mosquitto:
    ports: !override
      - "${MQTT_BIND:-127.0.0.1}:8883:8883"
    volumes:
      - ./mosquitto/mosquitto.tls.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./pki:/mosquitto/pki:ro

  ingest:
    environment:
      MQTT_PORT: "8883"
      MQTT_TLS: "1"
      MQTT_CA: /pki/ca-chain.crt
      MQTT_CERT: /pki/clients/ehg-ingest.crt
      MQTT_KEY: /pki/clients/ehg-ingest.key
    volumes:
      - ./pki:/pki:ro
