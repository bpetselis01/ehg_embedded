# EHG backend, cloud profile: the same 4 containers with MQTT over TLS 1.3 and client certificates.
# Run: tools/pki.sh init --host localhost && cd backend && docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
services:
  mosquitto:
    ports: !override
      - "${MQTT_BIND:-127.0.0.1}:8883:8883"
    volumes:
      - ./mosquitto/mosquitto.tls.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      # single files, never the whole pki directory: that also holds the intermediate CA key (and the root key until it is moved off)
      - ./pki/ca-chain.crt:/mosquitto/pki/ca-chain.crt:ro
      - ./pki/broker.crt:/mosquitto/pki/broker.crt:ro
      - ./pki/broker.key:/mosquitto/pki/broker.key:ro
      - ./pki/ca.crl:/mosquitto/pki/ca.crl:ro

  ingest:
    environment:
      MQTT_PORT: "8883"
      MQTT_TLS: "1"
      MQTT_CA: /pki/ca-chain.crt
      MQTT_CERT: /pki/ehg-ingest.crt
      MQTT_KEY: /pki/ehg-ingest.key
    volumes:
      - ./pki/ca-chain.crt:/pki/ca-chain.crt:ro
      - ./pki/clients/ehg-ingest.crt:/pki/ehg-ingest.crt:ro
      - ./pki/clients/ehg-ingest.key:/pki/ehg-ingest.key:ro
