# Cloud-profile broker. Used only through backend/docker-compose.cloud.yml; the local mosquitto.conf is untouched.
# PURPOSE: Settings for Mosquitto when MQTT must be private: TLS 1.3 only, a client certificate for every connection,
#   and a topic ACL per identity (docs/decisions/0008-mqtt-mtls-and-topic-acls.md).
# INPUT: certificates in /mosquitto/pki (made by tools/pki.sh, mounted read-only) and the ACL in /mosquitto/config/acl.
#   e.g. ca-chain.crt, broker.crt, broker.key, ca.crl in /mosquitto/pki; the ACL lists ehg-gw-01, ehg-bridge, ehg-ingest, ehg-viewer.
# HOW: One listener, 8883. tls_version is a MINIMUM in Mosquitto 2.x (checked against the 2.1.2 manual), so tlsv1.3 refuses TLS 1.2.
#   require_certificate + use_identity_as_username: the certificate's CN becomes the user name that the ACL matches.
#   use_username_as_clientid: the client id is forced to that same name (a security review found that without it one identity could hijack another's session).
#   allow_anonymous false: no certificate, no connection. There is no plain listener at all.
# ROLE IN THESIS: The gateway-to-broker boundary of docs/production-topology.md. Behaviour for the replayed data is unchanged.
# BEFORE -> AFTER: Before: anonymous plain 1883 (mosquitto.conf). After: only identities in the ACL can publish or read.
listener 8883
protocol mqtt
cafile   /mosquitto/pki/ca-chain.crt
certfile /mosquitto/pki/broker.crt
keyfile  /mosquitto/pki/broker.key
# revocation list; Mosquitto reads it at start-up. An EXPIRED list makes OpenSSL refuse every client (tools/pki.sh crl rewrites it)
crlfile  /mosquitto/pki/ca.crl
tls_version tlsv1.3
require_certificate true
use_identity_as_username true
# the client id becomes the user name (= the certificate CN), so one identity cannot take over another's session or kick it off.
# Consequence: two processes sharing one certificate also kick each other off, so give each process its own certificate (tools/pki.sh client NAME)
use_username_as_clientid true
allow_anonymous false
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
# QoS 1 backlog kept for a disconnected ingest service (persistent session)
max_queued_messages 100000
