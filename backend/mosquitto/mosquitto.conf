# Local development broker. Ports are bound to 127.0.0.1 in docker-compose.yml.
# PURPOSE: Settings for Mosquitto, the MQTT "post office" between gateway and backend.
# HOW: Listens on 1883, no login (local only), saves queued messages to disk.
# ROLE IN THESIS: Its queue means a restarting ingest service loses nothing (H2).
# BEFORE -> AFTER: gateway/gateway.py publishes here; ingest.py and viewer/server.py subscribe.
# Before cloud deployment: add password_file + TLS listener (8883) and set allow_anonymous false.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# QoS 1 backlog kept for a disconnected ingest service (persistent session)
max_queued_messages 100000
