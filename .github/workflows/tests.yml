# Runs the test suite on every push and pull request, so code and docs that drift apart (tests/test_docs.py) are caught before they are merged.
name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, for the authorship check below
      # Every commit is authored by its committer: no co-author trailers
      - run: "! git log --format=%B | grep -inE '^co-authored-by:'"
      - uses: astral-sh/setup-uv@v10.3.3  # this action publishes exact tags only, no moving v10
      - run: uv sync --frozen
      - run: uv run pytest -q
